<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="찬양 콘티">
<title>2026 수련회 찬양 콘티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    --bg:#F1F1F3;
    --ink:#101012;
    --card:#FFFFFF;
    --card-alt:#F5F5F7;
    --text:#151517;
    --text-muted:#8B8B93;
    --line:#E7E7EA;
    --accent:#F0A03D;
    --accent-soft:#FBEBD3;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --container-max: 560px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:var(--container-max);margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* 태블릿(가로 700px 이상) 대응 */
  @media (min-width:700px){
    :root{ --container-max: 900px; }
    .service-list{padding:0 16px 12px;}
    .hero p{font-size:19px;}
    .song-title,.score-row .title,.pl-songrow{font-size:15.5px;}
    .service-head .name{font-size:17px;}
  }

  /* Header */
  .topbar{padding:22px 18px 14px;display:flex;align-items:center;gap:12px;}
  .mark{
    width:38px;height:38px;flex:none;border-radius:11px;background:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .mark svg{width:19px;height:19px;}
  .topbar .titles{flex:1;}
  .topbar .eyebrow{font-size:11.5px;color:var(--text-muted);font-weight:600;letter-spacing:.02em;}
  .topbar h1{margin:2px 0 0;font-size:19px;font-weight:800;letter-spacing:-.2px;}
  .badge-pill{
    flex:none;font-size:11.5px;font-weight:700;color:var(--text-muted);background:var(--card-alt);
    border:1px solid var(--line);padding:5px 11px;border-radius:999px;
  }

  /* Hero card */
  .hero{
    margin:2px 18px 18px;background:var(--ink);border-radius:22px;padding:20px 20px 22px;
    color:#fff;position:relative;overflow:hidden;
  }
  .hero .eyebrow-pill{
    display:inline-block;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);
    padding:5px 11px;border-radius:999px;margin-bottom:12px;color:#fff;
  }
  .hero p{margin:0;font-size:17px;font-weight:700;line-height:1.5;max-width:88%;}
  .hero .sub{margin-top:8px;font-size:12.5px;color:rgba(255,255,255,.55);font-weight:600;}
  .hero .deco{position:absolute;right:-6px;bottom:-10px;opacity:.14;}
  .hero .deco svg{width:76px;height:76px;}

  /* Day tabs (필터형) */
  .daynav{display:flex;gap:8px;padding:0 18px 14px;overflow-x:auto;scrollbar-width:none;}
  .daynav::-webkit-scrollbar{display:none;}
  .daynav button{
    flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--text-muted);font-family:inherit;font-size:12.5px;font-weight:700;
  }
  .daynav button.on{color:#fff;background:var(--ink);border-color:var(--ink);}

  main{flex:1;padding:2px 16px calc(100px + var(--safe-b));}
  .panel{display:none;}
  .panel.active{display:block;}

  .section-title{font-size:12.5px;font-weight:800;color:var(--text-muted);letter-spacing:.04em;
    margin:22px 4px 10px;text-transform:uppercase;}

  /* Service card (더 이상 접었다 폈다 안 함 — Day 탭으로 필터링) */
  .service{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    margin-bottom:14px;overflow:hidden;
  }
  .service-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:16px 18px;border-bottom:1px solid var(--line);
  }
  .service-head .label{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .service-head .day{font-size:11.5px;letter-spacing:.06em;color:var(--text-muted);font-weight:800;}
  .service-head .name{font-size:16px;font-weight:800;}
  .service-head .leader{
    font-size:11.5px;font-weight:700;color:var(--text);background:var(--accent-soft);
    padding:3px 9px;border-radius:999px;
  }
  .service-head .count{font-size:12px;color:var(--text-muted);font-weight:600;flex:none;}
  .service-list{padding:0 10px 6px;}

  /* Song row (conti) */
  .song{border-top:1px solid var(--line);padding:12px 8px;}
  .song:first-child{border-top:none;}
  .song-top{display:flex;align-items:center;gap:10px;}
  .song-title{flex:1;font-size:14.5px;font-weight:700;line-height:1.4;}
  .ytlink{
    flex:none;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--card-alt);border:1px solid var(--line);color:#E24B4B;text-decoration:none;
  }
  .ytlink svg{width:14px;height:14px;}
  .note-text{
    margin-top:9px;font-size:13px;color:var(--text);line-height:1.55;
    background:var(--card-alt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    white-space:pre-wrap;
  }
  .note-text b{color:var(--text-muted);font-weight:700;font-size:11.5px;display:block;margin-bottom:3px;}

  /* Score rows */
  .score-row{border-top:1px solid var(--line);padding:12px 8px;display:flex;align-items:center;gap:10px;}
  .score-row:first-child{border-top:none;}
  .score-row .title{flex:1;font-size:14.5px;font-weight:700;}
  .score-row button.openscore{
    flex:none;padding:8px 15px;border-radius:10px;border:none;background:var(--ink);color:#fff;
    font-family:inherit;font-size:12.5px;font-weight:700;
  }
  .note-help{
    display:flex;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;margin:6px 0 16px;font-size:12.5px;color:var(--text-muted);line-height:1.55;
  }

  /* Playlist tab */
  .pl-hero{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--ink);color:#fff;text-decoration:none;border-radius:20px;padding:18px 20px;
    font-weight:800;font-size:15px;margin:6px 2px 18px;
  }
  .pl-hero-count{font-size:12px;font-weight:700;color:rgba(255,255,255,.55);}
  .pl-service-card{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:16px 18px;margin-bottom:14px;
  }
  .pl-service-card .head2{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
  .pl-service-card .head2 .day{font-size:11.5px;color:var(--text-muted);font-weight:800;}
  .pl-service-card .head2 .name{font-size:15px;font-weight:800;margin-left:6px;}
  .pl-service-card .head2 .leader{
    font-size:11px;font-weight:700;color:var(--text);background:var(--accent-soft);padding:3px 9px;border-radius:999px;
  }
  .pl-songrow{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13.5px;color:var(--text);font-weight:600;border-top:1px solid var(--line);}
  .pl-songrow:first-of-type{border-top:none;}
  .pl-songrow a{margin-left:auto;color:#E24B4B;flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
  .pl-songrow a svg{width:13px;height:13px;}
  .pl-open-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:12px;
    background:var(--ink);border:none;color:#fff;
    border-radius:12px;padding:11px;font-family:inherit;font-weight:800;font-size:13.5px;text-decoration:none;
  }

  /* Tab bar */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;max-width:var(--container-max);margin:0 auto;
    display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:10px 8px calc(10px + var(--safe-b));
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;
    color:var(--text-muted);font-family:inherit;font-size:11.5px;font-weight:700;padding:4px 0;
  }
  .tab svg{width:20px;height:20px;}
  .tab.on{color:var(--ink);}

  /* Fullscreen score viewer */
  .score-viewer{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;}
  .score-viewer[hidden]{display:none;}
  .sv-topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 14px 10px;padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:rgba(0,0,0,.55);
  }
  .sv-topbar button{
    background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:10px;padding:8px 13px;
    font-family:inherit;font-size:13px;font-weight:700;
  }
  #svTitle{color:#fff;font-size:13.5px;font-weight:700;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px;}
  .sv-stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;}
  .sv-stage img{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transform-origin:center center;}
  .sv-empty{color:rgba(255,255,255,.6);font-size:14px;text-align:center;padding:0 30px;line-height:1.6;}
  .sv-nav{display:flex;align-items:center;justify-content:center;gap:22px;padding:12px 14px calc(14px + var(--safe-b));background:rgba(0,0,0,.55);}
  .sv-nav button{background:rgba(255,255,255,.1);color:#fff;border:0;width:40px;height:40px;border-radius:50%;font-size:18px;}
  .sv-nav span{color:rgba(255,255,255,.7);font-size:12.5px;min-width:44px;text-align:center;}

  /* iOS는 진짜 Fullscreen API가 안 먹어서, 우리 UI(상/하단 바)를 숨기는 방식으로 "몰입 모드" 구현 */
  .score-viewer.immersive .sv-topbar,
  .score-viewer.immersive .sv-nav{
    opacity:0; pointer-events:none;
  }
  .score-viewer.immersive .sv-stage{ padding:0; }
  .sv-topbar, .sv-nav{ transition:opacity .2s ease; }

  /* 곡/페이지 전환 슬라이드 모션 */
  @keyframes svSlideNext{
    from{ transform:translateX(28px); opacity:0; }
    to{ transform:translateX(0); opacity:1; }
  }
  @keyframes svSlidePrev{
    from{ transform:translateX(-28px); opacity:0; }
    to{ transform:translateX(0); opacity:1; }
  }
  .sv-stage img.anim-next{ animation:svSlideNext .22s ease; }
  .sv-stage img.anim-prev{ animation:svSlidePrev .22s ease; }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3c2 3 6 5 6 9a6 6 0 0 1-12 0c0-4 4-6 6-9z"/>
      </svg>
    </div>
    <div class="titles">
      <div class="eyebrow">약속의 땅</div>
      <h1>찬양 콘티</h1>
    </div>
    <span class="badge-pill">2026 수련회</span>
  </header>

  <div class="hero">
    <span class="eyebrow-pill">함께 준비하는 찬양</span>
    <p>같이 부를 곡, 같이 남기는 연습 코멘트.</p>
    <div class="sub">예배별 콘티 · 악보 · 재생목록</div>
    <div class="deco">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="18" cy="16" r="3" fill="none" stroke="#fff" stroke-width="2"/></svg>
    </div>
  </div>

  <main>
    <!-- 콘티 -->
    <section id="panel-conti" class="panel active">
      <div class="daynav" data-nav="conti"></div>
      <div id="conti-list"></div>
    </section>

    <!-- 악보 -->
    <section id="panel-scores" class="panel">
      <div class="daynav" data-nav="scores"></div>
      <div class="note-help">
        <span>ℹ️</span>
        <span><b>scores</b> 폴더에 <b>곡영어이름.jpg</b>로 사진만 올리면 자동으로 인식돼요. (예: wake-up.jpg / png, jpeg도 인식)</span>
      </div>
      <div id="scores-list"></div>
    </section>

    <!-- 재생목록 -->
    <section id="panel-playlist" class="panel">
      <a class="pl-hero" id="pl-hero-all" target="_blank" rel="noopener">
        <span>▶ 전체곡 이어듣기</span>
        <span class="pl-hero-count"></span>
      </a>
      <div class="daynav" data-nav="playlist"></div>
      <div id="pl-services"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab on" data-tab="conti">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.4" fill="currentColor" stroke="none"/></svg>
      콘티
    </button>
    <button class="tab" data-tab="scores">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      악보
    </button>
    <button class="tab" data-tab="playlist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l6 3-6 3V9z" fill="currentColor" stroke="none"/></svg>
      재생목록
    </button>
  </nav>

  <!-- Fullscreen score viewer -->
  <div class="score-viewer" id="scoreViewer" hidden>
    <div class="sv-topbar">
      <button id="svClose">닫기</button>
      <div id="svTitle"></div>
      <button id="svFull">전체화면</button>
    </div>
    <div class="sv-stage" id="svStage">
      <img id="svImage" draggable="false" hidden>
      <div class="sv-empty" id="svEmpty" hidden></div>
    </div>
    <div class="sv-nav">
      <button id="svPrev">‹</button>
      <span id="svPageIndicator"></span>
      <button id="svNext">›</button>
    </div>
  </div>
</div>

<script>
/* ---------- 곡 데이터 ---------- */
const SONGS = {
  'wake-up':        {title:'일어나라 주의 백성', yt:'b-wKFZbuCfg'},
  'jacob-blessing':  {title:'야곱의 축복', yt:'VZuscqNiOjg'},
  'toward-hometown': {title:'본향을 향해', yt:'qtA4UlcxrVw'},
  'pray-together':   {title:'우리 함께 기도해', yt:'nsfPHVCQMTc'},
  'united-heart':    {title:'합심', yt:'bLpFLJ2p60o'},
  'gods-love':       {title:'하나님의 사랑이 | 사랑의 주님이', yt:'La22MF35OZs'},
  'presence':        {title:'주님의 임재 앞에서 | 멈출 수 없네', yt:'qAFtOwLOMLc'},
  'elijah-time':     {title:'지금은 엘리야 때처럼', yt:'w7VvoltD8nU'},
  'heart-worship':   {title:'마음의 예배', yt:'PV3LJu68nwk'},
  'way-maker':       {title:'길을 만드시는 분', yt:'VxRZDqbDoMk'},
  'come-reign':      {title:'오셔서 다스리소서', yt:'r3kv-wqTAAc'},
  'i-am-free':       {title:'나는 자유해', yt:'bPx7cJIAauk'},
  'wont-turn-back':  {title:'돌아서지 않으리', yt:'BBbHplr5jIY'},
  'as-you-lived':    {title:'주가 사셨듯이', yt:'yTuKlXb5_bA'},
  'called-me':       {title:'나를 부르신 주 | 하나님의 부르심', yt:'FekFUZLBlKk'}
};

/*
  ---------- 연습 코멘트 (팀원 전체 공유) ----------
  곡별로 코멘트를 적어두면 모든 사람에게 동일하게 보여요. (이 파일 자체에 저장 — 다시 배포해야 반영)
*/
const NOTES = {
  'wake-up': '', 'jacob-blessing': '', 'toward-hometown': '', 'pray-together': '',
  'united-heart': '', 'gods-love': '', 'presence': '', 'elijah-time': '',
  'heart-worship': '', 'way-maker': '', 'come-reign': '', 'i-am-free': '',
  'wont-turn-back': '', 'as-you-lived': '', 'called-me': ''
};

/*
  ---------- 예배 목록 + 담당자 ----------
  leader 값이 비어 있으면 화면엔 "담당 미정"으로 표시됩니다.
  담당자 알려주시면 여기 채워서 반영해드려요.
*/
const SERVICES = [
  {id:'d1-open',  day:'DAY 1', name:'개회예배',  leader:'', songs:['wake-up','jacob-blessing','toward-hometown','pray-together']},
  {id:'d1-night', day:'DAY 1', name:'저녁 집회', leader:'', songs:['united-heart','gods-love','toward-hometown','presence','elijah-time','heart-worship','way-maker']},
  {id:'d2-night', day:'DAY 2', name:'저녁 집회', leader:'', songs:['toward-hometown','come-reign','i-am-free','wont-turn-back','way-maker','as-you-lived','called-me']},
  {id:'d3-close', day:'DAY 3', name:'폐회예배',  leader:'', songs:['toward-hometown','heart-worship']}
];

const svg = {
  yt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12s0-3.4-.4-5a2.7 2.7 0 0 0-1.9-1.9C18 4.7 12 4.7 12 4.7s-6 0-7.7.4A2.7 2.7 0 0 0 2.4 7C2 8.6 2 12 2 12s0 3.4.4 5a2.7 2.7 0 0 0 1.9 1.9C6 19.3 12 19.3 12 19.3s6 0 7.7-.4A2.7 2.7 0 0 0 21.6 17c.4-1.6.4-5 .4-5zM10 15.4V8.6L15.8 12z"/></svg>'
};

function headHTML(svc){
  return `<div class="label">
      <span class="day">${svc.day}</span><span class="name">${svc.name}</span>
      <span class="leader">${svc.leader ? '담당 ' + svc.leader : '담당 미정'}</span>
    </div>
    <span class="count">${svc.songs.length}곡</span>`;
}

/* ---------- 콘티 탭 렌더 ---------- */
const contiList = document.getElementById('conti-list');
SERVICES.forEach(svc => {
  const card = document.createElement('div');
  card.className = 'service';
  card.dataset.day = svc.day;
  card.id = 'conti-' + svc.id;

  const head = document.createElement('div');
  head.className = 'service-head';
  head.innerHTML = headHTML(svc);
  card.appendChild(head);

  const list = document.createElement('div');
  list.className = 'service-list';
  svc.songs.forEach(slug => {
    const s = SONGS[slug];
    const note = NOTES[slug];
    const row = document.createElement('div');
    row.className = 'song';
    row.innerHTML = `
      <div class="song-top">
        <div class="song-title">${s.title}</div>
        <a class="ytlink" target="_blank" rel="noopener" href="https://youtu.be/${s.yt}">${svg.yt}</a>
      </div>
      ${note ? `<div class="note-text"><b>연습 코멘트</b>${note}</div>` : ''}`;
    list.appendChild(row);
  });
  card.appendChild(list);
  contiList.appendChild(card);
});

/* ---------- 악보 탭 렌더 ---------- */
const scoresList = document.getElementById('scores-list');
SERVICES.forEach(svc => {
  const card = document.createElement('div');
  card.className = 'service';
  card.dataset.day = svc.day;
  card.id = 'scores-' + svc.id;

  const head = document.createElement('div');
  head.className = 'service-head';
  head.innerHTML = headHTML(svc);
  card.appendChild(head);

  const list = document.createElement('div');
  list.className = 'service-list';
  svc.songs.forEach(slug => {
    const s = SONGS[slug];
    const row = document.createElement('div');
    row.className = 'score-row';
    row.innerHTML = `<div class="title">${s.title}</div><button class="openscore">악보 보기</button>`;
    row.querySelector('.openscore').onclick = () => openScoreViewer(svc.songs, svc.songs.indexOf(slug));
    list.appendChild(row);
  });
  card.appendChild(list);
  scoresList.appendChild(card);
});

/* ---------- 재생목록 탭 렌더 ---------- */
function playlistUrl(slugs){
  const ids = slugs.map(s => SONGS[s].yt).join(',');
  return `https://www.youtube.com/watch_videos?video_ids=${ids}`;
}

const heroAll = document.getElementById('pl-hero-all');
const allSlugs = Object.keys(SONGS);
heroAll.href = playlistUrl(allSlugs);
heroAll.querySelector('.pl-hero-count').textContent = `${allSlugs.length}곡`;

const plServices = document.getElementById('pl-services');
SERVICES.forEach(svc => {
  const card = document.createElement('div');
  card.className = 'pl-service-card';
  card.dataset.day = svc.day;
  const rows = svc.songs.map(slug => {
    const s = SONGS[slug];
    return `<div class="pl-songrow"><span>${s.title}</span><a target="_blank" rel="noopener" href="https://youtu.be/${s.yt}">${svg.yt}</a></div>`;
  }).join('');
  card.innerHTML = `
    <div class="head2">
      <div><span class="day">${svc.day}</span><span class="name">${svc.name}</span></div>
      <span class="leader">${svc.leader ? '담당 ' + svc.leader : '담당 미정'}</span>
    </div>
    ${rows}
    <a class="pl-open-btn" target="_blank" rel="noopener" href="${playlistUrl(svc.songs)}">▶ 유튜브에서 이어듣기</a>`;
  plServices.appendChild(card);
});

/* ---------- Day 탭 필터 (아코디언 대신) ---------- */
function applyDayFilter(listEl, day){
  [...listEl.children].forEach(card => {
    card.style.display = card.dataset.day === day ? '' : 'none';
  });
}
function buildDayNav(navEl, listEl){
  const days = [...new Set(SERVICES.map(s => s.day))];
  navEl.innerHTML = '';
  days.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.textContent = d;
    if(i === 0) btn.classList.add('on');
    btn.onclick = () => {
      navEl.querySelectorAll('button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      applyDayFilter(listEl, d);
    };
    navEl.appendChild(btn);
  });
  applyDayFilter(listEl, days[0]);
}
buildDayNav(document.querySelector('[data-nav="conti"]'), contiList);
buildDayNav(document.querySelector('[data-nav="scores"]'), scoresList);
buildDayNav(document.querySelector('[data-nav="playlist"]'), plServices);

/* ---------- 탭 전환 ---------- */
document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('on');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  };
});

/* ---------- 악보 풀스크린 뷰어 ---------- */
const viewer = document.getElementById('scoreViewer');
const svImage = document.getElementById('svImage');
const svEmpty = document.getElementById('svEmpty');
const svTitle = document.getElementById('svTitle');
const svStage = document.getElementById('svStage');
const svPageIndicator = document.getElementById('svPageIndicator');

let songQueue = [];   // 현재 예배의 곡 slug 배열
let songIndex = 0;    // 큐 안에서 지금 보고 있는 곡 인덱스
let currentPages = []; // 지금 곡의 악보 이미지 경로들 (보통 1장)
let currentPage = 0;   // 지금 곡 안에서 페이지 인덱스

// 확장자 대소문자/종류 다양하게 올라와도 인식하도록 여러 개 시도
const EXTS = ['jpg','JPG','jpeg','JPEG','png','PNG','webp','WEBP'];

function probeImage(src){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = src;
  });
}

async function findFlat(slug){
  for(const ext of EXTS){
    const path = `scores/${slug}.${ext}`;
    if(await probeImage(path)) return path;
  }
  return null;
}

async function findFolderPages(slug){
  const pages = [];
  for(let i = 1; i <= 8; i++){
    let found = null;
    for(const ext of EXTS){
      const path = `scores/${slug}/${i}.${ext}`;
      if(await probeImage(path)){ found = path; break; }
    }
    if(found) pages.push(found);
    else break;
  }
  return pages;
}

async function openScoreViewer(queue, idx){
  songQueue = queue;
  songIndex = idx;
  viewer.hidden = false;
  await loadSong(songIndex, 0, null);
}

async function loadSong(idx, pageToShow, dir){
  songIndex = idx;
  const slug = songQueue[idx];
  const s = SONGS[slug];
  svTitle.textContent = s.title;
  svImage.hidden = true;
  svEmpty.hidden = true;
  currentPages = [];

  const flat = await findFlat(slug);
  if(flat){
    currentPages = [flat];
  } else {
    currentPages = await findFolderPages(slug);
  }

  if(currentPages.length === 0){
    svEmpty.hidden = false;
    svEmpty.textContent = `아직 악보가 없어요.\nscores/${slug}.jpg 파일을 추가해주세요.`;
    svPageIndicator.textContent = `${idx+1} / ${songQueue.length}`;
  } else {
    const pageIndex = pageToShow === 'last' ? currentPages.length - 1 : (pageToShow || 0);
    showPage(pageIndex, dir);
  }
}

function showPage(i, dir){
  currentPage = i;
  resetZoom();
  svImage.hidden = false;
  svEmpty.hidden = true;
  if(dir){
    svImage.classList.remove('anim-next','anim-prev');
    void svImage.offsetWidth; // 리플로우로 애니메이션 재시작
    svImage.classList.add(dir === 'next' ? 'anim-next' : 'anim-prev');
  }
  svImage.src = currentPages[i];
  svPageIndicator.textContent = currentPages.length > 1
    ? `${songIndex+1}/${songQueue.length} · 페이지 ${i+1}/${currentPages.length}`
    : `${songIndex+1} / ${songQueue.length}`;
}

// 다음/이전: 같은 곡 안에 페이지가 더 있으면 페이지 이동, 없으면 다음/이전 곡으로 이동
async function goNext(){
  if(currentPage < currentPages.length - 1){
    showPage(currentPage + 1, 'next');
  } else if(songIndex < songQueue.length - 1){
    await loadSong(songIndex + 1, 0, 'next');
  }
}
async function goPrev(){
  if(currentPage > 0){
    showPage(currentPage - 1, 'prev');
  } else if(songIndex > 0){
    await loadSong(songIndex - 1, 'last', 'prev');
  }
}

document.getElementById('svClose').onclick = () => {
  viewer.hidden = true;
  viewer.classList.remove('immersive');
  document.getElementById('svFull').textContent = '전체화면';
  if(document.fullscreenElement) document.exitFullscreen();
};
document.getElementById('svFull').onclick = () => {
  const isImmersive = viewer.classList.toggle('immersive');
  document.getElementById('svFull').textContent = isImmersive ? '보기 전환' : '전체화면';
  // iOS 사파리는 일반 요소의 Fullscreen API를 지원하지 않아서 위 immersive 모드가 실제 동작함.
  // 지원하는 브라우저(안드로이드 크롬 등)에서는 추가로 진짜 전체화면도 함께 시도.
  if(isImmersive && viewer.requestFullscreen){
    viewer.requestFullscreen().catch(() => {});
  } else if(!isImmersive && document.fullscreenElement){
    document.exitFullscreen();
  }
};
document.getElementById('svPrev').onclick = goPrev;
document.getElementById('svNext').onclick = goNext;

/* pinch / pan / double-tap zoom */
let scale = 1, originX = 0, originY = 0, startDist = 0, startScale = 1, panning = false, lastX = 0, lastY = 0;
function resetZoom(){ scale = 1; originX = 0; originY = 0; applyTransform(); }
function applyTransform(){ svImage.style.transform = `translate(${originX}px, ${originY}px) scale(${scale})`; }

svStage.addEventListener('touchstart', e => {
  if(e.touches.length === 2){
    const [a,b] = e.touches;
    startDist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    startScale = scale;
  } else if(e.touches.length === 1 && scale > 1){
    panning = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  }
}, {passive:true});

svStage.addEventListener('touchmove', e => {
  if(e.touches.length === 2){
    const [a,b] = e.touches;
    const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    scale = Math.min(5, Math.max(1, startScale * (dist/startDist)));
    applyTransform();
  } else if(panning && e.touches.length === 1){
    const dx = e.touches[0].clientX - lastX;
    const dy = e.touches[0].clientY - lastY;
    originX += dx; originY += dy;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    applyTransform();
  }
}, {passive:true});

svStage.addEventListener('touchend', () => { panning = false; });

let lastTap = 0;
svStage.addEventListener('touchend', () => {
  const now = Date.now();
  if(now - lastTap < 300){
    scale = scale > 1 ? 1 : 2.4;
    originX = 0; originY = 0;
    applyTransform();
  }
  lastTap = now;
});

/* swipe left/right: 페이지가 더 있으면 페이지 이동, 없으면 다음/이전 곡으로 */
let touchStartX = 0;
svStage.addEventListener('touchstart', e => { if(e.touches.length===1) touchStartX = e.touches[0].clientX; }, {passive:true});
svStage.addEventListener('touchend', e => {
  if(scale > 1 || songQueue.length < 1) return;
  const endX = e.changedTouches[0].clientX;
  const diff = endX - touchStartX;
  if(diff > 60) goPrev();
  else if(diff < -60) goNext();
});
</script>
