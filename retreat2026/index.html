<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2026 수련회 찬양 콘티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    --bg:#12142A;
    --bg-deep:#0B0D1E;
    --bg-elevated:#1C2040;
    --bg-card:#242952;
    --accent:#F0A85A;
    --accent-dim:#B8783A;
    --accent-soft:rgba(240,168,90,0.14);
    --text:#F4EFE4;
    --text-muted:#9BA0C7;
    --border:rgba(255,255,255,0.09);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.5) 0, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,.4) 0, transparent 100%),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,.35) 0, transparent 100%),
      radial-gradient(1px 1px at 30% 85%, rgba(255,255,255,.3) 0, transparent 100%),
      radial-gradient(1px 1px at 90% 55%, rgba(255,255,255,.3) 0, transparent 100%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
    min-height:100%;
  }
  h1,h2,h3,.serif{font-family:'Gowun Batang',serif;}

  .app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* Header */
  .topbar{padding:28px 20px 18px;display:flex;align-items:center;gap:14px;}
  .flame{
    width:16px;height:20px;flex:none;
    background:radial-gradient(circle at 50% 30%, #FFE7B3 0%, var(--accent) 45%, var(--accent-dim) 100%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    transform:rotate(-8deg);
    filter:blur(0.2px) drop-shadow(0 0 6px rgba(240,168,90,.6));
    animation:flicker 2.6s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:1; transform:rotate(-8deg) scale(1);}
    30%{opacity:.85; transform:rotate(-4deg) scale(.94);}
    55%{opacity:1; transform:rotate(-10deg) scale(1.06);}
    80%{opacity:.9; transform:rotate(-6deg) scale(.97);}
  }
  .topbar h1{margin:0;font-size:22px;line-height:1.35;font-weight:700;letter-spacing:-.2px;}
  .topbar h1 span{display:block;font-size:15px;color:var(--accent);font-weight:400;margin-top:2px;}

  /* Day chips */
  .daynav{display:flex;gap:8px;padding:0 20px 14px;overflow-x:auto;scrollbar-width:none;}
  .daynav::-webkit-scrollbar{display:none;}
  .daynav button{
    flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--border);
    background:var(--bg-elevated);color:var(--text-muted);font-family:inherit;font-size:13px;font-weight:600;
  }
  .daynav button.on{color:var(--bg-deep);background:var(--accent);border-color:var(--accent);}

  main{flex:1;padding:4px 16px calc(96px + var(--safe-b));}
  .panel{display:none;}
  .panel.active{display:block;}

  /* Service card */
  .service{
    background:var(--bg-elevated);border:1px solid var(--border);border-radius:18px;
    margin-bottom:14px;overflow:hidden;
  }
  .service.expanded{border-color:rgba(240,168,90,.35);}
  .service-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:16px 18px;cursor:pointer;
  }
  .service-head .label{display:flex;align-items:baseline;gap:8px;}
  .service-head .day{font-size:12px;letter-spacing:.06em;color:var(--accent);font-weight:700;}
  .service-head .name{font-size:16px;font-weight:700;}
  .service-head .count{font-size:12px;color:var(--text-muted);}
  .chev{width:9px;height:9px;border-right:2px solid var(--text-muted);border-bottom:2px solid var(--text-muted);
    transform:rotate(45deg);transition:transform .2s;}
  .service.expanded .chev{transform:rotate(-135deg);}
  .service-body{max-height:0;overflow:hidden;transition:max-height .28s ease;}
  .service.expanded .service-body{max-height:3000px;}
  .service-list{padding:0 12px 12px;}

  /* Song row (conti) */
  .song{border-top:1px solid var(--border);padding:12px 6px;}
  .song:first-child{border-top:none;}
  .song-top{display:flex;align-items:center;gap:10px;}
  .song-title{flex:1;font-size:15px;font-weight:600;line-height:1.4;}
  .song-title .sub{display:block;font-size:12px;color:var(--text-muted);font-weight:400;margin-top:1px;}
  .ytlink,.notebtn{
    flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--bg-card);border:1px solid var(--border);color:var(--text-muted);text-decoration:none;
  }
  .ytlink svg,.notebtn svg{width:15px;height:15px;}
  .ytlink{color:#FF6B6B;}
  .notebtn.has-note{color:var(--accent);border-color:rgba(240,168,90,.4);}
  .note-wrap{max-height:0;overflow:hidden;transition:max-height .2s ease;}
  .note-wrap.open{max-height:200px;margin-top:10px;}
  .note-wrap textarea{
    width:100%;min-height:70px;resize:vertical;border-radius:12px;border:1px solid var(--border);
    background:var(--bg-card);color:var(--text);font-family:inherit;font-size:13.5px;padding:10px 12px;
  }
  .note-wrap textarea::placeholder{color:var(--text-muted);}
  .note-wrap .saved{font-size:11px;color:var(--text-muted);margin-top:4px;}

  /* Score list rows */
  .score-row{
    border-top:1px solid var(--border);padding:13px 6px;display:flex;align-items:center;gap:10px;
  }
  .score-row:first-child{border-top:none;}
  .score-row .title{flex:1;font-size:15px;font-weight:600;}
  .score-row button.openscore{
    flex:none;padding:7px 14px;border-radius:10px;border:1px solid rgba(240,168,90,.4);
    background:var(--accent-soft);color:var(--accent);font-family:inherit;font-size:13px;font-weight:700;
  }

  .note-help{
    display:flex;gap:10px;background:var(--bg-elevated);border:1px solid var(--border);
    border-radius:16px;padding:14px 16px;margin:6px 0 16px;font-size:12.5px;color:var(--text-muted);line-height:1.55;
  }

  /* Playlist */
  .plgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 2px 10px;}
  .plcard{
    background:var(--bg-card);border:1px solid var(--border);border-radius:14px;overflow:hidden;position:relative;
  }
  .plthumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--bg-deep);}
  .plcard iframe{width:100%;aspect-ratio:16/9;border:0;display:block;}
  .plplay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);
  }
  .plplay::after{
    content:'';width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;
    border-left:15px solid rgba(255,255,255,.92);margin-left:3px;
  }
  .plname{padding:8px 10px 11px;font-size:13px;font-weight:600;line-height:1.4;}

  .section-title{font-size:13px;font-weight:700;color:var(--text-muted);letter-spacing:.04em;
    margin:22px 4px 10px;text-transform:uppercase;}

  /* Tab bar */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;
    display:flex;background:rgba(18,20,42,.88);backdrop-filter:blur(14px);
    border-top:1px solid var(--border);padding:10px 8px calc(10px + var(--safe-b));
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;
    color:var(--text-muted);font-family:inherit;font-size:11.5px;font-weight:600;padding:4px 0;
  }
  .tab svg{width:21px;height:21px;}
  .tab.on{color:var(--accent);}

  /* Fullscreen score viewer */
  .score-viewer{
    position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;
  }
  .score-viewer[hidden]{display:none;}
  .sv-topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 14px calc(10px + var(--safe-b), 0px);padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:rgba(0,0,0,.55);
  }
  .sv-topbar button{
    background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:10px;padding:8px 13px;
    font-family:inherit;font-size:13px;font-weight:600;
  }
  #svTitle{color:#fff;font-size:13.5px;font-weight:600;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px;}
  .sv-stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;}
  .sv-stage img{max-width:100%;max-height:100%;user-select:none;-webkit-user-drag:none;transform-origin:center center;}
  .sv-empty{color:rgba(255,255,255,.6);font-size:14px;text-align:center;padding:0 30px;line-height:1.6;}
  .sv-nav{display:flex;align-items:center;justify-content:center;gap:22px;padding:12px 14px calc(14px + var(--safe-b));background:rgba(0,0,0,.55);}
  .sv-nav button{background:rgba(255,255,255,.1);color:#fff;border:0;width:40px;height:40px;border-radius:50%;font-size:18px;}
  .sv-nav span{color:rgba(255,255,255,.7);font-size:12.5px;min-width:44px;text-align:center;}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="flame"></div>
    <h1>2026 수련회<span>찬양 콘티</span></h1>
  </header>

  <main>
    <!-- 콘티 -->
    <section id="panel-conti" class="panel active">
      <div class="daynav" data-nav="conti"></div>
      <div id="conti-list"></div>
    </section>

    <!-- 악보 -->
    <section id="panel-scores" class="panel">
      <div class="daynav" data-nav="scores"></div>
      <div class="note-help">
        <span>ℹ️</span>
        <span>악보 이미지는 <b>scores/[곡폴더]/1.jpg, 2.jpg …</b> 순서로 파일만 넣어두면 자동으로 인식돼요. 곡별 폴더명은 아래 안내 파일(README) 참고.</span>
      </div>
      <div id="scores-list"></div>
    </section>

    <!-- 재생목록 -->
    <section id="panel-playlist" class="panel">
      <div class="section-title">전체곡 (중복 없이)</div>
      <div class="plgrid" id="pl-all"></div>
      <div id="pl-services"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab on" data-tab="conti">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.4" fill="currentColor" stroke="none"/></svg>
      콘티
    </button>
    <button class="tab" data-tab="scores">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      악보
    </button>
    <button class="tab" data-tab="playlist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l6 3-6 3V9z" fill="currentColor" stroke="none"/></svg>
      재생목록
    </button>
  </nav>

  <!-- Fullscreen score viewer -->
  <div class="score-viewer" id="scoreViewer" hidden>
    <div class="sv-topbar">
      <button id="svClose">닫기</button>
      <div id="svTitle"></div>
      <button id="svFull">전체화면</button>
    </div>
    <div class="sv-stage" id="svStage">
      <img id="svImage" draggable="false" hidden>
      <div class="sv-empty" id="svEmpty" hidden></div>
    </div>
    <div class="sv-nav">
      <button id="svPrev">‹</button>
      <span id="svPageIndicator"></span>
      <button id="svNext">›</button>
    </div>
  </div>
</div>

<script>
/* ---------- 데이터 ---------- */
const SONGS = {
  'wake-up':        {title:'일어나라 주의 백성', yt:'b-wKFZbuCfg'},
  'jacob-blessing':  {title:'야곱의 축복', yt:'VZuscqNiOjg'},
  'toward-hometown': {title:'본향을 향해', yt:'qtA4UlcxrVw'},
  'pray-together':   {title:'우리 함께 기도해', yt:'nsfPHVCQMTc'},
  'united-heart':    {title:'합심', yt:'bLpFLJ2p60o'},
  'gods-love':       {title:'하나님의 사랑이 | 사랑의 주님이', yt:'La22MF35OZs'},
  'presence':        {title:'주님의 임재 앞에서 | 멈출 수 없네', yt:'qAFtOwLOMLc'},
  'elijah-time':     {title:'지금은 엘리야 때처럼', yt:'w7VvoltD8nU'},
  'heart-worship':   {title:'마음의 예배', yt:'PV3LJu68nwk'},
  'way-maker':       {title:'길을 만드시는 분', yt:'VxRZDqbDoMk'},
  'come-reign':      {title:'오셔서 다스리소서', yt:'r3kv-wqTAAc'},
  'i-am-free':       {title:'나는 자유해', yt:'bPx7cJIAauk'},
  'wont-turn-back':  {title:'돌아서지 않으리', yt:'BBbHplr5jIY'},
  'as-you-lived':    {title:'주가 사셨듯이', yt:'yTuKlXb5_bA'},
  'called-me':       {title:'나를 부르신 주 | 하나님의 부르심', yt:'FekFUZLBlKk'}
};

const SERVICES = [
  {id:'d1-open',  day:'DAY 1', name:'개회예배',   songs:['wake-up','jacob-blessing','toward-hometown','pray-together']},
  {id:'d1-night', day:'DAY 1', name:'저녁 집회',  songs:['united-heart','gods-love','toward-hometown','presence','elijah-time','heart-worship','way-maker']},
  {id:'d2-night', day:'DAY 2', name:'저녁 집회',  songs:['toward-hometown','come-reign','i-am-free','wont-turn-back','way-maker','as-you-lived','called-me']},
  {id:'d3-close', day:'DAY 3', name:'폐회예배',   songs:['toward-hometown','heart-worship']}
];

const svg = {
  yt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12s0-3.4-.4-5a2.7 2.7 0 0 0-1.9-1.9C18 4.7 12 4.7 12 4.7s-6 0-7.7.4A2.7 2.7 0 0 0 2.4 7C2 8.6 2 12 2 12s0 3.4.4 5a2.7 2.7 0 0 0 1.9 1.9C6 19.3 12 19.3 12 19.3s6 0 7.7-.4A2.7 2.7 0 0 0 21.6 17c.4-1.6.4-5 .4-5zM10 15.4V8.6L15.8 12z"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>'
};

/* ---------- 코멘트 저장 ---------- */
const NOTE_KEY = 'retreat2026_comments_v1';
const notes = JSON.parse(localStorage.getItem(NOTE_KEY) || '{}');
function saveNote(slug, val){
  notes[slug] = val;
  localStorage.setItem(NOTE_KEY, JSON.stringify(notes));
}

/* ---------- 콘티 탭 렌더 ---------- */
const contiList = document.getElementById('conti-list');
SERVICES.forEach((svc, si) => {
  const card = document.createElement('div');
  card.className = 'service' + (si === 0 ? ' expanded' : '');
  card.id = 'conti-' + svc.id;

  const head = document.createElement('div');
  head.className = 'service-head';
  head.innerHTML = `<div class="label"><span class="day">${svc.day}</span><span class="name">${svc.name}</span></div>
    <div style="display:flex;align-items:center;gap:10px;"><span class="count">${svc.songs.length}곡</span><span class="chev"></span></div>`;
  head.onclick = () => card.classList.toggle('expanded');
  card.appendChild(head);

  const body = document.createElement('div');
  body.className = 'service-body';
  const list = document.createElement('div');
  list.className = 'service-list';

  svc.songs.forEach(slug => {
    const s = SONGS[slug];
    const row = document.createElement('div');
    row.className = 'song';
    const hasNote = !!notes[slug];
    row.innerHTML = `
      <div class="song-top">
        <div class="song-title">${s.title}</div>
        <a class="ytlink" target="_blank" rel="noopener" href="https://youtu.be/${s.yt}">${svg.yt}</a>
        <button class="notebtn ${hasNote ? 'has-note' : ''}">${svg.note}</button>
      </div>
      <div class="note-wrap ${hasNote ? 'open' : ''}">
        <textarea placeholder="이 곡, 어떻게 연습해올지 적어보세요">${notes[slug] || ''}</textarea>
        <div class="saved">자동 저장됨</div>
      </div>`;
    const noteBtn = row.querySelector('.notebtn');
    const noteWrap = row.querySelector('.note-wrap');
    const textarea = row.querySelector('textarea');
    noteBtn.onclick = () => noteWrap.classList.toggle('open');
    textarea.addEventListener('input', () => {
      saveNote(slug, textarea.value);
      noteBtn.classList.toggle('has-note', !!textarea.value);
    });
    list.appendChild(row);
  });

  body.appendChild(list);
  card.appendChild(body);
  contiList.appendChild(card);
});

/* ---------- 악보 탭 렌더 ---------- */
const scoresList = document.getElementById('scores-list');
SERVICES.forEach((svc, si) => {
  const card = document.createElement('div');
  card.className = 'service' + (si === 0 ? ' expanded' : '');
  card.id = 'scores-' + svc.id;

  const head = document.createElement('div');
  head.className = 'service-head';
  head.innerHTML = `<div class="label"><span class="day">${svc.day}</span><span class="name">${svc.name}</span></div>
    <div style="display:flex;align-items:center;gap:10px;"><span class="count">${svc.songs.length}곡</span><span class="chev"></span></div>`;
  head.onclick = () => card.classList.toggle('expanded');
  card.appendChild(head);

  const body = document.createElement('div');
  body.className = 'service-body';
  const list = document.createElement('div');
  list.className = 'service-list';

  svc.songs.forEach(slug => {
    const s = SONGS[slug];
    const row = document.createElement('div');
    row.className = 'score-row';
    row.innerHTML = `<div class="title">${s.title}</div><button class="openscore">악보 보기</button>`;
    row.querySelector('.openscore').onclick = () => openScoreViewer(slug);
    list.appendChild(row);
  });

  body.appendChild(list);
  card.appendChild(body);
  scoresList.appendChild(card);
});

/* ---------- 재생목록 탭 렌더 ---------- */
function makePlCard(slug){
  const s = SONGS[slug];
  const card = document.createElement('div');
  card.className = 'plcard';
  card.innerHTML = `
    <div class="thumbwrap" style="position:relative;">
      <img class="plthumb" src="https://img.youtube.com/vi/${s.yt}/mqdefault.jpg" alt="">
      <div class="plplay"></div>
    </div>
    <div class="plname">${s.title}</div>`;
  card.querySelector('.thumbwrap').onclick = function(){
    this.outerHTML = `<iframe src="https://www.youtube.com/embed/${s.yt}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  };
  return card;
}
const plAll = document.getElementById('pl-all');
Object.keys(SONGS).forEach(slug => plAll.appendChild(makePlCard(slug)));

const plServices = document.getElementById('pl-services');
SERVICES.forEach(svc => {
  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = `${svc.day} · ${svc.name}`;
  plServices.appendChild(title);
  const grid = document.createElement('div');
  grid.className = 'plgrid';
  svc.songs.forEach(slug => grid.appendChild(makePlCard(slug)));
  plServices.appendChild(grid);
});

/* ---------- Day 퀵네비 ---------- */
function buildDayNav(container, prefix){
  const days = [...new Set(SERVICES.map(s => s.day))];
  container.innerHTML = '';
  days.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.textContent = d;
    if(i === 0) btn.classList.add('on');
    btn.onclick = () => {
      container.querySelectorAll('button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      const first = SERVICES.find(s => s.day === d);
      const el = document.getElementById(prefix + '-' + first.id);
      if(el){ el.classList.add('expanded'); el.scrollIntoView({behavior:'smooth', block:'start'}); }
    };
    container.appendChild(btn);
  });
}
buildDayNav(document.querySelector('[data-nav="conti"]'), 'conti');
buildDayNav(document.querySelector('[data-nav="scores"]'), 'scores');

/* ---------- 탭 전환 ---------- */
document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('on');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  };
});

/* ---------- 악보 풀스크린 뷰어 ---------- */
const viewer = document.getElementById('scoreViewer');
const svImage = document.getElementById('svImage');
const svEmpty = document.getElementById('svEmpty');
const svTitle = document.getElementById('svTitle');
const svStage = document.getElementById('svStage');
const svPageIndicator = document.getElementById('svPageIndicator');
let currentPages = [];
let currentPage = 0;

function probeImage(src){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = src;
  });
}

async function openScoreViewer(slug){
  const s = SONGS[slug];
  svTitle.textContent = s.title;
  viewer.hidden = false;
  currentPages = [];
  currentPage = 0;
  svImage.hidden = true;
  svEmpty.hidden = true;

  for(let i = 1; i <= 8; i++){
    const path = `scores/${slug}/${i}.jpg`;
    const ok = await probeImage(path);
    if(ok) currentPages.push(path);
    else break;
  }

  if(currentPages.length === 0){
    svEmpty.hidden = false;
    svEmpty.textContent = `아직 악보가 없어요.\nscores/${slug}/1.jpg 파일을 추가해주세요.`;
    svPageIndicator.textContent = '';
  } else {
    showPage(0);
  }
}

function showPage(i){
  currentPage = i;
  resetZoom();
  svImage.hidden = false;
  svEmpty.hidden = true;
  svImage.src = currentPages[i];
  svPageIndicator.textContent = `${i+1} / ${currentPages.length}`;
}

document.getElementById('svClose').onclick = () => {
  viewer.hidden = true;
  if(document.fullscreenElement) document.exitFullscreen();
};
document.getElementById('svFull').onclick = () => {
  if(!document.fullscreenElement) viewer.requestFullscreen?.();
  else document.exitFullscreen();
};
document.getElementById('svPrev').onclick = () => { if(currentPage > 0) showPage(currentPage - 1); };
document.getElementById('svNext').onclick = () => { if(currentPage < currentPages.length - 1) showPage(currentPage + 1); };

/* pinch / pan / double-tap zoom */
let scale = 1, originX = 0, originY = 0, startDist = 0, startScale = 1, panning = false, lastX = 0, lastY = 0;
function resetZoom(){ scale = 1; originX = 0; originY = 0; applyTransform(); }
function applyTransform(){ svImage.style.transform = `translate(${originX}px, ${originY}px) scale(${scale})`; }

svStage.addEventListener('touchstart', e => {
  if(e.touches.length === 2){
    const [a,b] = e.touches;
    startDist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    startScale = scale;
  } else if(e.touches.length === 1 && scale > 1){
    panning = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  }
}, {passive:true});

svStage.addEventListener('touchmove', e => {
  if(e.touches.length === 2){
    const [a,b] = e.touches;
    const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    scale = Math.min(5, Math.max(1, startScale * (dist/startDist)));
    applyTransform();
  } else if(panning && e.touches.length === 1){
    const dx = e.touches[0].clientX - lastX;
    const dy = e.touches[0].clientY - lastY;
    originX += dx; originY += dy;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    applyTransform();
  }
}, {passive:true});

svStage.addEventListener('touchend', e => {
  panning = false;
  if(e.touches.length === 0 && currentPages.length > 1 && scale === 1){
    const dx = (e.changedTouches[0]?.clientX || 0) - lastX;
  }
});

let lastTap = 0;
svStage.addEventListener('touchend', e => {
  const now = Date.now();
  if(now - lastTap < 300){
    scale = scale > 1 ? 1 : 2.4;
    originX = 0; originY = 0;
    applyTransform();
  }
  lastTap = now;
});

/* swipe left/right when not zoomed */
let touchStartX = 0;
svStage.addEventListener('touchstart', e => { if(e.touches.length===1) touchStartX = e.touches[0].clientX; }, {passive:true});
svStage.addEventListener('touchend', e => {
  if(scale > 1 || currentPages.length < 2) return;
  const endX = e.changedTouches[0].clientX;
  const diff = endX - touchStartX;
  if(diff > 60 && currentPage > 0) showPage(currentPage - 1);
  else if(diff < -60 && currentPage < currentPages.length - 1) showPage(currentPage + 1);
});
</script>
